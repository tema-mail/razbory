<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аватары ботов</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#16171a;--muted:#5f6470;--line:#e2e2de}
html[data-theme=dark]{--bg:#141518;--card:#1f2125;--text:#e4e4e2;--muted:#9aa0ab;--line:#33363c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:30px;margin:0 0 8px}p{color:var(--muted);margin:0 0 24px;max-width:720px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
figure img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:zoom-in}
#z{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9}#z img{max-width:96vw;max-height:90vh}#z button{position:absolute;right:14px;top:14px;font-size:28px;line-height:1;background:none;border:0;color:#fff;cursor:pointer}
figcaption{padding:10px 14px}figcaption b{display:inline-block;min-width:28px;color:#4f8cff}
#t{position:fixed;right:14px;top:14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}
</style>
<script>(function(){var s;try{s=localStorage.getItem('tema')}catch(e){}var h=new Date().getHours();var d=s?s==='dark':(h>=19||h<7||matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'})();</script>
</head><body><button id="t" type="button">Тема</button><main><h1>Аватары ботов: выбери по одному</h1><p>Стиль как у Евы: киборг, светятся глаза, белый фон, крупно лицо. Показано кругом, как в Telegram. Напиши три номера, например «t2 m1 n3» – поставлю всем трём ботам.</p><h2 style="margin:24px 0 8px">Тренер · @trener_artem_bot</h2><div class="g"><figure><img src="img/t1.webp" alt="Мужчина, зелёные глаза, хром на челюсти, чёрная спортивная куртка" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>t1</b> Мужчина, зелёные глаза, хром на челюсти, чёрная спортивная куртка</figcaption></figure><figure><img src="img/t2.webp" alt="Женщина, рыжий хвост, яблоко, зелёная куртка" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>t2</b> Женщина, рыжий хвост, яблоко, зелёная куртка</figcaption></figure><figure><img src="img/t3.webp" alt="Лысый, оранжевые глаза, шейкер, серое худи" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>t3</b> Лысый, оранжевые глаза, шейкер, серое худи</figcaption></figure><figure><img src="img/t4.webp" alt="Женщина, короткие чёрные волосы, миска салата, белая куртка" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>t4</b> Женщина, короткие чёрные волосы, миска салата, белая куртка</figcaption></figure></div><h2 style="margin:24px 0 8px">Ментор Гром · @mentorbott_bot</h2><div class="g"><figure><img src="img/m1.webp" alt="Седеющий, борода, глаза синие как молния, хром на шее, чёрная футболка" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>m1</b> Седеющий, борода, глаза синие как молния, хром на шее, чёрная футболка</figcaption></figure><figure><img src="img/m2.webp" alt="Ёжик, жёлтые глаза, шов над бровью, военная куртка" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>m2</b> Ёжик, жёлтые глаза, шов над бровью, военная куртка</figcaption></figure><figure><img src="img/m3.webp" alt="Седой, лет 50, синие глаза, хром у уха, кожанка" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>m3</b> Седой, лет 50, синие глаза, хром у уха, кожанка</figcaption></figure><figure><img src="img/m4.webp" alt="Лысый, графитовая кожа, бело-синие глаза, чёрное худи" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>m4</b> Лысый, графитовая кожа, бело-синие глаза, чёрное худи</figcaption></figure></div><h2 style="margin:24px 0 8px">Заметки · @Notes_Artem1_bot</h2><div class="g"><figure><img src="img/n1.webp" alt="Девушка в очках, карандаш в пучке, блокнот, янтарные глаза" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>n1</b> Девушка в очках, карандаш в пучке, блокнот, янтарные глаза</figcaption></figure><figure><img src="img/n2.webp" alt="Мужчина, волнистые волосы, пишет в блокноте, бирюзовые глаза" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>n2</b> Мужчина, волнистые волосы, пишет в блокноте, бирюзовые глаза</figcaption></figure><figure><img src="img/n3.webp" alt="Серебристое каре, белый фарфор, открытая книга" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>n3</b> Серебристое каре, белый фарфор, открытая книга</figcaption></figure><figure><img src="img/n4.webp" alt="Чёрная коса, ручка за ухом, джинсовая рубашка" loading="lazy" style="border-radius:50%;width:78%;margin:16px auto 0"><figcaption><b>n4</b> Чёрная коса, ручка за ухом, джинсовая рубашка</figcaption></figure></div></main>
<div id="z"><button type="button" aria-label="Закрыть">✕</button><img alt=""></div>
<script>document.getElementById('t').onclick=function(){var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('tema',n)}catch(e){}};
var z=document.getElementById('z');document.querySelectorAll('figure img').forEach(function(i){i.onclick=function(){z.querySelector('img').src=i.src;z.style.display='flex'}});z.onclick=function(){z.style.display='none'};document.addEventListener('keydown',function(e){if(e.key==='Escape')z.style.display='none'});</script>
</body></html>
