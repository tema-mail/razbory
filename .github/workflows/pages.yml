name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tema-mail/seo-razbory
          token: ${{ secrets.RAZBORY_TOKEN }}
          path: src
      - name: Собрать сайт
        run: |
          mkdir site
          cp src/robots.txt site/ 2>/dev/null || true
          for d in src/*-*/; do cp -r "$d" site/; done
          printf '<!doctype html><meta charset="utf-8"><title>404</title>' > site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
