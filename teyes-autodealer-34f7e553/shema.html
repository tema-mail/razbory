<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Схема обмена CRM и АвтоДилера</title>
<style>
body{margin:0;background:#f6f6f4;font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;color:#1b1c1e}
.wrap{width:1200px;padding:20px}
svg text{font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
</style></head><body><div class="wrap">
<svg viewBox="0 0 1160 700" width="1160" height="700" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3d6fd8"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f8a4c"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c07a00"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a8d93"/></marker>
</defs>
<text x="0" y="24" font-size="22" font-weight="700">Кто чем владеет и что куда ходит</text>
<text x="0" y="48" font-size="14" fill="#6b6e74">Ключ связи – телефон в виде +7XXXXXXXXXX и номер заказ-наряда. Обе системы держат данные в РФ.</text>

<!-- Каналы -->
<rect x="0" y="80" width="200" height="300" rx="14" fill="#fff" stroke="#e2e2de"/>
<text x="16" y="108" font-size="16" font-weight="700">Клиент пишет, звонит</text>
<text x="16" y="138" font-size="14">Max, Telegram, ВК</text>
<text x="16" y="162" font-size="14">WhatsApp</text>
<text x="16" y="186" font-size="14">заявки с сайта</text>
<text x="16" y="210" font-size="14">звонки (кнопкой)</text>
<text x="16" y="250" font-size="13" fill="#6b6e74">все каналы – только</text>
<text x="16" y="268" font-size="13" fill="#6b6e74">в CRM. Те же номера</text>
<text x="16" y="286" font-size="13" fill="#6b6e74">в чаты АвтоДилера</text>
<text x="16" y="304" font-size="13" fill="#6b6e74">(Wazzup) не подключать</text>
<line x1="200" y1="200" x2="262" y2="200" stroke="#3d6fd8" stroke-width="2.5" marker-end="url(#a)"/>

<!-- CRM -->
<rect x="266" y="80" width="330" height="420" rx="14" fill="#eef3ff" stroke="#3d6fd8" stroke-width="2"/>
<text x="284" y="110" font-size="18" font-weight="700" fill="#2a56b8">Наша CRM (Chatwoot + мосты)</text>
<text x="284" y="132" font-size="13" fill="#6b6e74">FirstVDS, Москва</text>
<text x="284" y="164" font-size="14" font-weight="600">Главная для:</text>
<text x="284" y="188" font-size="14">• обращение и переписка</text>
<text x="284" y="210" font-size="14">• канал и «откуда узнал»</text>
<text x="284" y="232" font-size="14">• стадия до «записан»</text>
<text x="284" y="254" font-size="14">• менеджер, скорость ответа</text>
<text x="284" y="290" font-size="14" font-weight="600">Новые поля (вариант А):</text>
<text x="284" y="314" font-size="14">• номер заказ-наряда</text>
<text x="284" y="336" font-size="14">• сумма и дата приезда</text>
<text x="284" y="358" font-size="14">• контролёр: «приехал» без ЗН</text>
<rect x="284" y="384" width="294" height="98" rx="10" fill="#fff" stroke="#3d6fd8"/>
<text x="298" y="408" font-size="14" font-weight="700">Сквозная аналитика</text>
<text x="298" y="430" font-size="13">источник → обращение → запись</text>
<text x="298" y="450" font-size="13">→ приезд → деньги</text>
<text x="298" y="470" font-size="12" fill="#6b6e74">раз в месяц: итог сверяется с отчётом АД</text>

<!-- AutoDealer -->
<rect x="830" y="80" width="330" height="420" rx="14" fill="#fff6e8" stroke="#c07a00" stroke-width="2"/>
<text x="848" y="110" font-size="18" font-weight="700" fill="#9a6200">АвтоДилер Онлайн</text>
<text x="848" y="132" font-size="13" fill="#6b6e74">Яндекс Облако, РФ · 599 ₽ за место/мес</text>
<text x="848" y="164" font-size="14" font-weight="600">Главный для (до переезда):</text>
<text x="848" y="188" font-size="14">• клиент, машина, VIN</text>
<text x="848" y="210" font-size="14">• запись на пост</text>
<text x="848" y="232" font-size="14">• заказ-наряд и оплата</text>
<text x="848" y="254" font-size="14">• склад, зарплата, касса, 1С</text>
<text x="848" y="290" font-size="14" font-weight="600">Что умеет отдать:</text>
<text x="848" y="314" font-size="14">• Excel: клиенты (только Владелец)</text>
<text x="848" y="336" font-size="14">• Excel: «Реестр заказ-нарядов»</text>
<text x="848" y="358" font-size="14">  (телефон, VIN, сумма, баланс)</text>
<text x="848" y="380" font-size="14">• файл в 1С (EnterpriseData)</text>
<text x="848" y="414" font-size="14" font-weight="600" fill="#b3261e">Открытого API нет.</text>
<text x="848" y="436" font-size="13" fill="#b3261e">Оферта 5.2.12–5.2.13: нельзя</text>
<text x="848" y="454" font-size="13" fill="#b3261e">скрипты и выгрузку в сторонние</text>
<text x="848" y="472" font-size="13" fill="#b3261e">программы, неустойка 1 млн ₽</text>

<!-- arrows -->
<line x1="600" y1="170" x2="826" y2="170" stroke="#1f8a4c" stroke-width="3" marker-end="url(#g)"/>
<text x="612" y="160" font-size="13" font-weight="700" fill="#1f8a4c">А · менеджер руками</text>
<text x="612" y="192" font-size="12" fill="#1f8a4c">клиент, телефон, машина, причина</text>
<text x="612" y="208" font-size="12" fill="#1f8a4c">кнопка «скопировать для АД»</text>

<line x1="826" y1="250" x2="600" y2="250" stroke="#1f8a4c" stroke-width="3" marker-end="url(#g)"/>
<text x="640" y="240" font-size="13" font-weight="700" fill="#1f8a4c">А · обратно руками</text>
<text x="612" y="272" font-size="12" fill="#1f8a4c">№ ЗН, сумма, дата приезда</text>

<line x1="826" y1="330" x2="600" y2="330" stroke="#c07a00" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#o)"/>
<text x="640" y="320" font-size="13" font-weight="700" fill="#9a6200">Б · Excel раз в неделю</text>
<text x="612" y="352" font-size="12" fill="#9a6200">реестр ЗН → сверка по телефону</text>
<text x="612" y="368" font-size="12" fill="#9a6200">только с письменного «да» АД</text>

<line x1="600" y1="420" x2="826" y2="420" stroke="#8a8d93" stroke-width="2" stroke-dasharray="3 5" marker-start="url(#k)" marker-end="url(#k)"/>
<text x="640" y="410" font-size="13" font-weight="700" fill="#6b6e74">В · API в обе стороны</text>
<text x="612" y="442" font-size="12" fill="#6b6e74">только если АД даст доступ</text>

<!-- forbidden -->
<rect x="266" y="540" width="894" height="140" rx="14" fill="#fdeeee" stroke="#b3261e"/>
<text x="284" y="570" font-size="16" font-weight="700" fill="#b3261e">Не делаем (риск расторжения и неустойки 1 млн ₽ по оферте)</text>
<text x="284" y="598" font-size="14">✕ робот, который входит в кабинет АвтоДилера и сам скачивает выгрузки (п. 5.2.12)</text>
<text x="284" y="622" font-size="14">✕ чтение их внутреннего /api из кода, разбор их программы (п. 5.2.5, 5.2.8)</text>
<text x="284" y="646" font-size="14">✕ любые данные клиентов через claude-vps в Нидерландах (152-ФЗ) – только серверы в РФ</text>
<text x="284" y="670" font-size="13" fill="#6b6e74">Excel-выгрузку в CRM (Б) – только после письменного разрешения АвтоДилера (п. 5.2.13)</text>
<text x="0" y="560" font-size="13" fill="#6b6e74">Зелёное – делаем сейчас.</text>
<text x="0" y="580" font-size="13" fill="#6b6e74">Жёлтое – после «да» АД.</text>
<text x="0" y="600" font-size="13" fill="#6b6e74">Серое – если дадут API.</text>
</svg></div></body></html>
