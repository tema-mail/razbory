  - generic [ref=f1e80]:
    - generic [ref=f1e81]: Правила площадок
    - heading "Чтобы не забанили" [level=2] [ref=f1e82]
    - list [ref=f1e83]:
      - listitem [ref=f1e84]: "Дром-форум: реклама своей деятельности в сообщениях запрещена. Бренд в нике, аватаре и поле «Город» тоже нельзя. Услуги в подписи – только после 256 сообщений. Значит: личный ник, ответы по делу, на прямой вопрос «где в городе» – одна строка «я из такого-то сервиса»."
      - listitem [ref=f1e85]: "Дром «Вопросы и ответы»: отвечать может любой, вход через аккаунт Дрома. Ссылку не ставим."
      - listitem [ref=f1e86]: "Geely Club: партнёром может стать любой сервис: регистрация, тема в подразделе, скидка по карте клуба, одобрение в течение дня. По закону о рекламе это реклама: пометка «Реклама», ИП и erid."
