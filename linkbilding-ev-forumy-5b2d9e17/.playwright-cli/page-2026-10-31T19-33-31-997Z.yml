  - generic [ref=f1e139]:
    - generic [ref=f1e140]: Деньги
    - heading "Что купить платно сейчас" [level=2] [ref=f1e141]
    - list [ref=f1e142]:
      - listitem [ref=f1e143]: "Одна статья через биржу на /rusifikaciya/honda/, до 5 000 ₽. Это единственная страница EV на 11–25 месте в Яндексе со спросом: «Honda XR-V русификация», 13 место, 361 запрос в месяц (данные 27.10). Перед покупкой: свежая позиция, страница в индексе, донор по чек-листу, пометка «Реклама» и erid."
      - listitem [ref=f1e144]: Остальные страницы EV – нет, рано. Спрос у них 0–14 запросов в месяц, платить за сдвиг без спроса – деньги в ноль.
      - listitem [ref=f1e145]: Платные ветки Дрома и drive2-бизнес – нет. Сначала бесплатные ответы и проверка, приходят ли люди.
