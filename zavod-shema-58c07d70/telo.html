.zs-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

.zs-svg path.on{stroke:var(--zv);stroke-width:2.5;stroke-dasharray:7 5;animation:zsb 1s linear infinite}

.zs-det p{margin:4px 0}
.zs-det ol,.zs-det ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.zs-det li{border:1px solid var(--zl);border-radius:10px;padding:8px 10px;background:var(--zf)}
.zs-det li small{color:var(--zm);display:block;margin-top:2px}
.zs-meh{display:inline-block;border:1px dashed var(--zl);border-radius:6px;padding:0 6px;font-size:12.5px;color:var(--zm);margin:4px 4px 0 0}
.zs-zakr{float:right;border:1px solid var(--zl);background:var(--zf);border-radius:9px;width:36px;height:36px;font-size:18px;line-height:1}
.zs-per{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.zs-per button:hover{border-color:var(--zv)}
.zs-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:780px){
.zs-ch{grid-template-columns:repeat(3,1fr)}
.zs-pole{padding:12px}
.zs-km{grid-template-columns:1fr;gap:26px;min-height:0;justify-items:center}
.zs-kl,.zs-kr{align-items:stretch;width:100%;gap:14px}
.zs-vet,.zs-kl .zs-vet{flex-direction:column;align-items:stretch;gap:8px}

.zs-vs,.zs-kl .zs-vs{align-items:stretch;padding-left:18px;border-left:2px solid var(--zl);margin-left:14px}
.zs-sp{white-space:normal;text-align:left}
.zs-ryad{grid-template-columns:1fr;gap:20px}
.zs-2{grid-template-columns:1fr}
}
</style>
